[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "python-step-recorder"
version = "1.0.0"
description = "A modern, cross-platform alternative to Windows Steps Recorder (PSR) written in Python."
authors = [{ name = "Company Tools Team" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pillow>=10.0.0",
    "mss>=9.0.0",
    "pynput>=1.7.6",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
linux = ["python-xlib>=0.33"]
windows = ["pywin32>=306"]

[project.scripts]
step-recorder = "step_recorder.cli:main"

